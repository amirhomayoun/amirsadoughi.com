baseURL = "https://amirsadoughi.com/"
locale = "en-US"
title = "Amir H. Sadoughi"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  author = "Amir H. Sadoughi"
  since = 2014
  # Shown on the home page
  subtitle = "Writer ... solely for compilers, and now maybe for humans too!"
  description = "Amir H. Sadoughi's personal site: notes on Linux, self-hosting, networking and tools."
  mastodonHost = "mastodon.amirsadoughi.com"

  # Comments: set host (and siteID) to turn on remark42.
  # Also allow the host in netlify.toml's Content-Security-Policy.
  [params.remark42]
    host = ""
    siteID = "remark"

  # Shown in the footer
  [params.social]
    github = "amirhomayoun"
    mastodon = "amir"
    linkedin = "amirsadoughi"
    stackoverflow = "1727639"
    goodreads = "119584"
    lastfm = "amirhomayoun"
    typeracer = "amirhomayoun"
    athlinks = "252998642"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/post"
    weight = 1
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 2
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 3
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false
