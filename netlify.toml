[build.environment]
  NODE_VERSION = "24"
  HUGO_VERSION = "0.170.1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "child-src 'self' app.netlify.com; script-src 'self' app.netlify.com netlify-cdp-loader.netlify.app amirsadoughi.com;"
    Permissions-Policy = "geolocation=()"
